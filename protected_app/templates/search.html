<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search - Protected Demo App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
        }
        button {
            padding: 10px 20px;
            background: #28a745;
            border: none;
            color: white;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eef;
            border-radius: 8px;
        }
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Search</h1>
        <form method="get" action="/search">
            <label>Search Query</label>
            <input type="text" name="q" placeholder="Search something..." value="{{ query }}">
            <button type="submit">Search</button>
        </form>

        {% if query %}
        <div class="result">
            <strong>You searched for:</strong> {{ query }}
        </div>
        {% endif %}

        <p><strong>Use this route to test SQLi / XSS-like payloads via query string.</strong></p>
        <p><a href="/">← Back to Home</a></p>
    </div>
</body>
</html>
